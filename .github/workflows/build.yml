name: Build BunoTunner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # baixa o LibreHardwareMonitorLib 0.9.6 (e as dependencias) do NuGet para a pasta libs
      - name: Baixar LibreHardwareMonitor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lhm | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <OutputType>Library</OutputType>
              <CopyLocalLockFileAssemblies>true</CopyLocalLockFileAssemblies>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LibreHardwareMonitorLib" Version="0.9.6" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Path lhm/lhm.csproj -Encoding utf8
          $b = dotnet build lhm/lhm.csproj -c Release -o lhm/out 2>&1
          Write-Host "::notice::OUT=$((Get-ChildItem lhm/out -Recurse | ForEach-Object { $_.Name }) -join ' | ')"
          $pk = Join-Path $env:USERPROFILE '.nuget/packages/librehardwaremonitorlib/0.9.6'
          $all = Get-ChildItem $pk -Recurse -Filter LibreHardwareMonitorLib.dll
          Write-Host "::notice::FOUND=$(($all | ForEach-Object { $_.FullName.Substring($pk.Length) }) -join ' | ')"
          $lib = $all | Where-Object { $_.FullName -match 'win-x64.lib.net472' } | Select-Object -First 1
          if (-not $lib) { $lib = $all | Select-Object -First 1 }
          if ($lib) { Copy-Item $lib.FullName libs/ -Force }
          Get-ChildItem lhm/out -Filter *.dll | Where-Object { $_.Name -ne 'lhm.dll' } | ForEach-Object { Copy-Item $_.FullName libs/ -Force }
          Write-Host "::notice::LIBS=$((Get-ChildItem libs | ForEach-Object { $_.Name }) -join ' | ')"
          if (-not (Test-Path libs/LibreHardwareMonitorLib.dll)) { Write-Host "::error::LibreHardwareMonitorLib.dll nao foi copiado"; exit 1 }

      # baixa o modulo oficial e assinado IntelMCHBAR do PawnIO.Modules (LGPL-2.1+) para ler os timings em CPUs Intel
      - name: Baixar modulo PawnIO IntelMCHBAR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path pio | Out-Null
          $rel = gh api repos/namazso/PawnIO.Modules/releases/latest | ConvertFrom-Json
          Write-Host "::notice::PawnIO.Modules $($rel.tag_name): $(($rel.assets | ForEach-Object { $_.name }) -join ' | ')"
          foreach ($a in $rel.assets) {
            Invoke-WebRequest -Uri $a.browser_download_url -OutFile (Join-Path pio $a.name)
          }
          Get-ChildItem pio -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath (Join-Path pio ($_.BaseName)) -Force }
          $f = Get-ChildItem pio -Recurse -Filter IntelMCHBAR.bin | Select-Object -First 1
          if ($f) { Copy-Item $f.FullName libs/IntelMCHBAR.bin -Force; Write-Host "::notice::IntelMCHBAR.bin copiado ($($f.Length) bytes)" }
          else { Write-Host "::warning::IntelMCHBAR.bin nao encontrado no release; timings Intel ficarao indisponiveis" }

      - name: Compilar
        shell: pwsh
        run: |
          $out = cmd /c "build.bat 2>&1"
          $code = $LASTEXITCODE
          $out | Out-File build.log -Encoding utf8
          $out | ForEach-Object { Write-Host $_ }
          $n = 0
          foreach ($l in $out) { if ($l -match 'error|warning|ERRO|Copie|Nao encontrei') { $n++; if ($n -le 40) { Write-Host "::error::$l" } } }
          exit $code

      - name: Log de compilacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Ler versao
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path BunoTunner.cs -Pattern 'Version = "(v[0-9.]+)"' | Select-Object -First 1
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: BunoTunner-${{ steps.ver.outputs.version }}
          path: BunoTunner.exe

      # publica/atualiza um Release com o .exe da versao
      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release view $v 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $v BunoTunner.exe --clobber }
          else { gh release create $v BunoTunner.exe --title "BunoTunner $v" --notes "Build automatica do commit ${{ github.sha }}." }
